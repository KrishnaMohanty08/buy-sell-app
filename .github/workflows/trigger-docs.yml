name: 📡 Trigger AI Docs

on:
  push:
    branches: [main]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Trigger AI DevDocs Engine
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/KrishnaMohanty08/AI-Production-Doc/dispatches \
            -d '{"event_type": "generate-docs"}'